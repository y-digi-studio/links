<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Y-digi Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100dvh;
  background: #1f1f1d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px 56px;
  font-family: 'Zen Kaku Gothic New', sans-serif;
}

.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  overflow: hidden;
  margin-bottom: 18px;
  border: 2px solid #2a2a2a;
  flex-shrink: 0;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 30px;
  letter-spacing: 0.08em;
  color: #f0f0f0;
  margin-bottom: 6px;
  text-align: center;
}

.tagline {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: #555;
  margin-bottom: 40px;
  text-align: center;
  text-transform: uppercase;
}

.links {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  height: 60px;
  background: #161616;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  text-decoration: none;
  color: #e8e8e8;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, transform 0.12s;
  -webkit-tap-highlight-color: transparent;
}

.link-btn:hover, .link-btn:focus {
  background: #222;
  border-color: #444;
  outline: none;
}

.link-btn:active {
  transform: scale(0.97);
}

.btn-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.btn-icon.x-icon {
  background: #000;
  position: relative;
}

.btn-icon.x-icon img {
  width: 65%;
  height: 65%;
  object-fit: contain;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.btn-label {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.04em;
  flex: 1;
  color: #e0e0e0;
}

.btn-arrow {
  font-size: 18px;
  color: #444;
  line-height: 1;
}

.footer {
  margin-top: 40px;
  font-size: 11px;
  color: #444;
  letter-spacing: 0.1em;
}
</style>
</head>
